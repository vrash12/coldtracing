name: coldtrace

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: coldtrace-app:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: coldtrace
      DB_USERNAME: coldtrace
      DB_PASSWORD: coldtrace
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    volumes:
      - ./:/var/www/html
      - composer-vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: coldtrace
      MYSQL_USER: coldtrace
      MYSQL_PASSWORD: coldtrace
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  queue:
    image: coldtrace-app:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: coldtrace
      DB_USERNAME: coldtrace
      DB_PASSWORD: coldtrace
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    command: ["php", "artisan", "queue:work", "--verbose", "--tries=1", "--timeout=90"]
    stop_grace_period: 30s
    volumes:
      - ./:/var/www/html
      - composer-vendor:/var/www/html/vendor
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy

  test:
    image: coldtrace-app:local
    profiles: ["tools"]
    environment:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
    command: ["php", "artisan", "test"]
    volumes:
      - ./:/var/www/html
      - composer-vendor:/var/www/html/vendor

  vite:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      DOCKER_ENV: "true"
      CHOKIDAR_USEPOLLING: "true"
      VITE_HMR_HOST: localhost
    command: ["sh", "-c", "npm ci --ignore-scripts && npm run dev -- --host 0.0.0.0"]
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html
      - node-modules:/var/www/html/node_modules

volumes:
  composer-vendor:
  mysql-data:
  node-modules:
